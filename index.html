<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Anugopan R J – Playable Unity Portfolio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{--bg:#0f1a24;--surface:#17252f;--line:#2a3d4b;--text:#e9eef2;--muted:#9fb1bf;--accent:#8f82ff;--accent2:#ffc857;--onaccent:#12101f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f6f8;--surface:#fff;--line:#d3dce3;--text:#14212b;--muted:#4d6170;--accent:#5a49e0;--accent2:#9a6b00;--onaccent:#fff}}
:root[data-theme="light"]{--bg:#f4f6f8;--surface:#fff;--line:#d3dce3;--text:#14212b;--muted:#4d6170;--accent:#5a49e0;--accent2:#9a6b00;--onaccent:#fff}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 1.05rem/1.6 "IBM Plex Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.1;margin:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent2);outline-offset:3px;border-radius:4px}
#bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:calc(.7rem + env(safe-area-inset-top,0px)) 1rem .7rem;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(8px)}
#bar b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.1rem;display:block;line-height:1.2}
#bar span{font-size:.8rem;color:var(--muted);font-weight:400;font-family:"IBM Plex Sans",sans-serif}
nav{display:flex;gap:.4rem}
nav button{font:inherit;font-size:.9rem;color:var(--text);background:none;border:1px solid var(--line);border-radius:99px;padding:.3rem .9rem;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#start{position:fixed;inset:0;z-index:4;display:grid;place-content:center;text-align:center;gap:.9rem;padding:1.5rem;background:rgba(8,18,26,.55);color:#fff}
#start h1{font-size:clamp(2.4rem,9vw,5rem);font-weight:800;letter-spacing:-.03em}
#start p{margin:0;font-size:1.15rem;color:#dbe5ec}
#start button{justify-self:center;font:inherit;font-weight:500;background:#ffc857;color:#1b1500;border:0;border-radius:12px;padding:.85rem 1.8rem;cursor:pointer;font-size:1.1rem}
#start small{color:#b9c8d3}
#hint{position:fixed;left:0;right:0;bottom:calc(1rem + env(safe-area-inset-bottom,0px));text-align:center;color:#fff;font-size:.9rem;text-shadow:0 1px 6px #000;pointer-events:none;z-index:3}
#panel{position:fixed;right:1rem;bottom:calc(3rem + env(safe-area-inset-bottom,0px));z-index:3;width:min(400px,calc(100% - 2rem));max-height:58vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.25rem}
#panel[hidden],#quick[hidden],#start[hidden],#hint[hidden]{display:none}
#panel h2,#quick h2{font-size:1.6rem;margin-bottom:.8rem}
#panel p,#quick p{margin:0 0 .8rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;padding:0;margin:0 0 .8rem;list-style:none}
.chips li{border:1px solid var(--line);padding:.15rem .7rem;border-radius:99px;font-size:.88rem}
.card{border-top:1px solid var(--line);padding:.9rem 0 .1rem}
.card h3{font-size:1.15rem;margin-bottom:.3rem}
.tl{list-style:none;margin:0;padding:0 0 0 1.2rem;border-left:2px solid var(--line)}
.tl li{position:relative;padding-bottom:1rem}
.tl li::before{content:"";position:absolute;left:calc(-1.2rem - 6px);top:.45rem;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tl h3{font-size:1.05rem}.tl span{color:var(--muted);font-size:.88rem}.tl p{margin:.2rem 0 0;font-size:.95rem}
html{scroll-behavior:smooth;scroll-padding-top:5.5rem}
#sec{display:none}
body.q #sec{display:flex;gap:1.3rem}
#sec a{color:var(--muted);text-decoration:none;font-size:.95rem}#sec a:hover{color:var(--text)}
#quick{max-width:960px;margin:0 auto;padding:6.5rem 1.5rem 3rem}
#quick .hero{padding:2rem 0 3rem}
#quick .hero small{color:var(--muted);font-size:1rem}
#quick .hero h1{font-size:clamp(2.8rem,9vw,5.6rem);font-weight:800;letter-spacing:-.035em;margin:.6rem 0 1rem}
#quick .hero p{color:var(--muted);font-size:1.25rem;max-width:46ch;margin:0 0 1.75rem}
.btns{display:flex;gap:.7rem;flex-wrap:wrap}
.btn{display:inline-block;font:inherit;font-weight:500;text-decoration:none;color:var(--text);background:none;border:1px solid var(--line);border-radius:10px;padding:.7rem 1.3rem;cursor:pointer}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
#quick section{padding:3.5rem 0;border-top:1px solid var(--line)}
#quick .sh{display:flex;align-items:baseline;gap:.9rem;margin-bottom:1.5rem}
#quick .sh h2{margin:0;font-size:clamp(1.9rem,4vw,2.6rem)}
#quick .sh i{font-style:normal;color:var(--accent);font-family:"Bricolage Grotesque",sans-serif;font-weight:700}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:2.5rem}
.open,.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.25rem}
.open h3,.group h3{font-size:1.05rem;margin-bottom:.7rem}
.open ul{margin:0;padding-left:1.1rem}
.proj{display:grid;grid-template-columns:260px 1fr;gap:1.5rem;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:1.5rem}
.cover{display:flex;align-items:flex-end;padding:1.2rem;min-height:220px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.9rem;line-height:1.05;color:#fff}
.c1{background:linear-gradient(135deg,#3b2fa8,#8f82ff 60%,#ffc857)}
.c2{background:linear-gradient(135deg,#0b4f5c,#1fa6a0 70%,#d7f3c0);color:#06222a}
.c3{background:linear-gradient(135deg,#7a1f3d,#e05d6f 65%,#ffd9b0)}
.proj .d{padding:1.4rem 1.4rem 1.2rem 0}
.proj h3{font-size:1.5rem;margin:.2rem 0 .4rem}
.tag{font-size:.85rem;color:var(--accent2);font-weight:500}
.proj h4{margin:1rem 0 .3rem;font-size:.95rem;color:var(--muted);font-weight:500;font-family:"IBM Plex Sans",sans-serif}
.proj ul.b{margin:0 0 .5rem;padding-left:1.1rem}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.25rem}
#quick .tl em{font-style:normal;color:var(--accent2);font-size:.85rem;font-weight:500;display:block}
#quick .big{font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(1.5rem,5vw,2.8rem);font-weight:700;word-break:break-all}
#quick footer{padding-top:2rem;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
@media (min-width:761px){.proj.wide{grid-template-columns:400px 1fr}}
.cover.ph{padding:0;min-height:0;display:block;position:relative}
.cover.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:860px){body.q #sec{display:none}}
@media (max-width:760px){.cover.ph{aspect-ratio:16/9}.two,.proj{grid-template-columns:1fr}.proj .d{padding:0 1.2rem 1.2rem}.cover{min-height:140px}}
@media (max-width:640px){#panel{right:1rem;left:1rem;width:auto}#bar span{display:none}}
</style>
</head>

var running=false,started=false,mode3d=true,ren,scene,cam,kart,pads=[],K={x:0,z:0,a:0,v:0},down={},joy={s:0,t:0},cur=null,last=0;

function setMode(q){
 mode3d=!q;quick.hidden=!q;cv.style.display=q?'none':'block';
 $('m3d').setAttribute('aria-pressed',String(!q));$('mq').setAttribute('aria-pressed',String(q));
 document.body.style.overflow=q?'auto':'hidden';document.body.classList.toggle('q',q);
 if(q){startEl.hidden=true;panel.hidden=true;hint.hidden=true;running=false;scrollTo(0,0)}
 else{if(!ren){try{build()}catch(e){ren=null}if(!ren){$('m3d').disabled=true;setMode(true);return}}startEl.hidden=started;hint.hidden=!started;if(!running){running=true;last=performance.now();loop()}}
}
$('m3d').onclick=function(){setMode(false)};$('mq').onclick=function(){setMode(true)};

function label(text,color){
 var c=document.createElement('canvas');c.width=384;c.height=96;var g=c.getContext('2d');
 g.fillStyle='rgba(10,20,28,.82)';g.beginPath();g.roundRect?g.roundRect(4,8,376,80,24):g.rect(4,8,376,80);g.fill();
 g.strokeStyle='#'+('000000'+color.toString(16)).slice(-6);g.lineWidth=5;g.stroke();
 g.fillStyle='#fff';g.font='700 40px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(text,192,50);
 var s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));
 s.scale.set(9,2.25,1);s.renderOrder=5;return s;
}

function build(){
 ren=new THREE.WebGLRenderer({canvas:cv,antialias:true});
 ren.setPixelRatio(Math.min(devicePixelRatio,2));
 scene=new THREE.Scene();scene.background=new THREE.Color(0x12303f);scene.fog=new THREE.Fog(0x12303f,40,150);
 cam=new THREE.PerspectiveCamera(60,1,.1,400);
 scene.add(new THREE.HemisphereLight(0xbfd8ff,0x35503f,.9));
 var d=new THREE.DirectionalLight(0xffd9a0,.9);d.position.set(30,40,-20);scene.add(d);
 var top=new THREE.Mesh(new THREE.CylinderGeometry(40,40,2,48),new THREE.MeshLambertMaterial({color:0x3f7d5b}));top.position.y=-1;scene.add(top);
 var under=new THREE.Mesh(new THREE.ConeGeometry(40,28,24),new THREE.MeshLambertMaterial({color:0x5a4632,flatShading:true}));under.rotation.x=Math.PI;under.position.y=-16;scene.add(under);
 var st=[];for(var i=0;i<400;i++){var u=Math.random()*6.28,v=Math.random()*1.2+.1,r=160;st.push(Math.cos(u)*Math.cos(v)*r,Math.sin(v)*r,Math.sin(u)*Math.cos(v)*r)}
 var sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(st,3));
 scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:1.4,fog:false})));
 keys.forEach(function(k,i){
  var a=i/keys.length*Math.PI*2+.6,x=Math.sin(a)*23,z=Math.cos(a)*23,col=C[k].c;
  var p=new THREE.Mesh(new THREE.CylinderGeometry(4.2,4.2,.3,32),new THREE.MeshLambertMaterial({color:col,emissive:col,emissiveIntensity:.5}));
  p.position.set(x,.1,z);scene.add(p);
  var beam=new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,6,8),new THREE.MeshBasicMaterial({color:col}));beam.position.set(x,3.2,z);scene.add(beam);
  var l=label(C[k].t.split(' and ')[0],col);l.position.set(x,7.5,z);scene.add(l);
  pads.push({k:k,x:x,z:z,m:p});
 });
 var tm=new THREE.MeshLambertMaterial({color:0x2d6a4f,flatShading:true}),tr=new THREE.MeshLambertMaterial({color:0x6b4a2f});
 for(var n=0,tries=0;n<34&&tries<400;tries++){
  var a2=Math.random()*6.28,r2=9+Math.random()*28,tx=Math.sin(a2)*r2,tz=Math.cos(a2)*r2;
  if(pads.some(function(p){return Math.hypot(p.x-tx,p.z-tz)<8}))continue;
  var s=.8+Math.random()*.9,t1=new THREE.Mesh(new THREE.ConeGeometry(1.5*s,4*s,6),tm);t1.position.set(tx,2.6*s,tz);
  var t2=new THREE.Mesh(new THREE.CylinderGeometry(.25*s,.25*s,1*s,6),tr);t2.position.set(tx,.5*s,tz);scene.add(t1,t2);n++;
 }
 kart=new THREE.Group();
 var body=new THREE.Mesh(new THREE.BoxGeometry(1.5,.55,2.6),new THREE.MeshLambertMaterial({color:0xffc857}));body.position.y=.7;
 var cab=new THREE.Mesh(new THREE.BoxGeometry(1,.45,1.1),new THREE.MeshLambertMaterial({color:0x8f82ff}));cab.position.set(0,1.18,-.2);
 kart.add(body,cab);
 var wm=new THREE.MeshLambertMaterial({color:0x1a1f26});
 [[-.85,1.0],[.85,1.0],[-.85,-1.0],[.85,-1.0]].forEach(function(w){var m=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,.3,14),wm);m.rotation.z=Math.PI/2;m.position.set(w[0],.4,w[1]);kart.add(m)});
 scene.add(kart);
 resize();
}
function resize(){if(!ren)return;ren.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);

function begin(){if(started)return;started=true;startEl.hidden=true;hint.hidden=false}
$('go').onclick=begin;
addEventListener('keydown',function(e){
 if(!mode3d)return;
 if(!started&&e.target===document.body){begin()}
 down[e.code]=1;if(started&&/^(Arrow|Space)/.test(e.code)&&e.target===document.body)e.preventDefault();
});
addEventListener('keyup',function(e){down[e.code]=0});
var o=null;
cv.addEventListener('pointerdown',function(e){begin();o={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',function(e){if(!o)return;joy.s=Math.max(-1,Math.min(1,(e.clientX-o.x)/70));joy.t=Math.max(-1,Math.min(1,(o.y-e.clientY)/70))});
function endp(){o=null;joy.s=0;joy.t=0}
cv.addEventListener('pointerup',endp);cv.addEventListener('pointercancel',endp);

function update(dt,t){
 var th=(down.KeyW||down.ArrowUp?1:0)-(down.KeyS||down.ArrowDown?1:0)+joy.t;
 var st=(down.KeyA||down.ArrowLeft?1:0)-(down.KeyD||down.ArrowRight?1:0)-joy.s;
 if(started){
  K.v+=th*18*dt;K.v*=1-(th?.3:1.4)*dt;K.v=Math.max(-8,Math.min(22,K.v));
  K.a+=st*1.9*dt*Math.max(-1,Math.min(1,K.v/8));
  K.x+=Math.sin(K.a)*K.v*dt;K.z+=Math.cos(K.a)*K.v*dt;
  var r=Math.hypot(K.x,K.z);if(r>37){K.x*=37/r;K.z*=37/r;K.v*=.6}
 }
 kart.position.set(K.x,0,K.z);kart.rotation.y=K.a;kart.rotation.z=-st*.06*Math.min(1,Math.abs(K.v)/10);
 var tx=K.x-Math.sin(K.a)*9,tz=K.z-Math.cos(K.a)*9,k=1-Math.exp(-4*dt);
 if(!started){var s=t*.0002;tx=Math.sin(s)*20;tz=Math.cos(s)*20;cam.position.set(tx,9,tz);cam.lookAt(0,1,0)}
 else{cam.position.x+=(tx-cam.position.x)*k;cam.position.y+=(5-cam.position.y)*k;cam.position.z+=(tz-cam.position.z)*k;cam.lookAt(K.x,1.2,K.z)}
 var near=null;pads.forEach(function(p){p.m.rotation.y=t*.001;if(Math.hypot(p.x-K.x,p.z-K.z)<4.6)near=p.k});
 if(started&&near!==cur){cur=near;if(near){panel.innerHTML=view(near);panel.hidden=false;hint.hidden=true}else{panel.hidden=true;hint.hidden=false}}
}
function loop(now){
 if(!running)return;requestAnimationFrame(loop);
 now=now||performance.now();var dt=Math.min(.05,(now-last)/1000);last=now;
 update(dt,now);ren.render(scene,cam);
}
setMode(true);
})();
